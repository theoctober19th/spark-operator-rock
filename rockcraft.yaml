name: spark-operator
summary: Kubeflow Spark Operator on top of Charmed Apache Spark
description: |
  The Kubeflow Spark Operator controller, packaged with the Charmed Apache Spark distribution
  (Spark with Kubernetes support, spark8t and a JVM), for use in the spark-operator-k8s charm.

  The controller shells out to `$SPARK_HOME/bin/spark-submit` to submit SparkApplications, which
  is why it needs a Spark distribution next to it. The `spark` and `spark8t` parts are copied
  from charmed-spark-rock (images/charmed-spark/rockcraft.yaml): keep them in line with it.

license: Apache-2.0

# Version of the Spark Operator; the Spark distribution is pinned in the `spark` part.
version: "2.6.0"

base: ubuntu@22.04

platforms:
  amd64:
  arm64:

run-user: _daemon_

# No services: the charm provides the Pebble layer that runs the controller.

environment:
  SPARK_HOME: /opt/spark
  SPARK_CONF_DIR: /etc/spark/conf
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-${CRAFT_ARCH_BUILD_FOR}
  PYTHONPATH: /opt/spark/python:/opt/spark8t/python/dist:/opt/spark/python/lib/py4j.zip:/usr/lib/python3.10/site-packages
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/spark:/opt/spark/bin:/opt/spark/python/bin
  HOME: /var/lib/spark

parts:
  # Copied from charmed-spark-rock.
  spark:
    plugin: dump
    source: https://github.com/canonical/central-uploader/releases/download/spark-3.4.4-ubuntu10/spark-3.4.4-ubuntu10-20260521123200-bin-k8s.tgz
    source-checksum: sha512/99a33773879d2995e3c83def51338b6bbb45417d8064ecdfdca28189a89cc81ca3e8278b9e78351bcd4a1cce0db9907abd6e0c34016d29d0a8bfe8aa27315a2e
    overlay-script: |
      sed -i 's/http:\/\/deb.\(.*\)/https:\/\/deb.\1/g' /etc/apt/sources.list
      apt-get update
      ln -svf /lib /lib64
      apt-get install -y bash
      mkdir -p /opt/spark/python
      touch /opt/spark/RELEASE
      rm /bin/sh
      ln -svf /bin/bash /bin/sh
      echo "auth required pam_wheel.so use_uid" >> /etc/pam.d/su
      rm -rf /var/cache/apt/*
    organize:
      conf: etc/spark/conf
      jars: opt/spark/jars
      bin: opt/spark/bin
      sbin: opt/spark/sbin
      python: opt/spark/python
      kubernetes/dockerfiles/spark/entrypoint.sh: opt/spark/entrypoint.sh
      kubernetes/dockerfiles/spark/decom.sh: opt/spark/decom.sh
      examples: opt/spark/examples
      kubernetes/tests: opt/spark/tests
      data: opt/spark/data
    stage:
      - etc/spark/conf
      - opt/spark/jars
      - opt/spark/bin
      - opt/spark/sbin
      - opt/spark/entrypoint.sh
      - opt/spark/decom.sh
      - opt/spark/examples
      - opt/spark/tests
      - opt/spark/python
      - opt/spark/data

  # Copied from charmed-spark-rock. Not used by the controller yet: it is for submitting with
  # `python3 -m spark8t.cli.spark_submit`.
  spark8t:
    plugin: nil
    after: [spark]
    build-packages:
      - wget
      - ssl-cert
      - git
    overlay-packages:
      - python3-pip
    overlay-script: |
      mkdir -p $CRAFT_PART_INSTALL/opt/spark8t/python/dist
      pip install --target=${CRAFT_PART_INSTALL}/opt/spark8t/python/dist spark8t==1.3.1
      rm usr/bin/pip*
    stage:
      - opt/spark8t/python/dist

  # The only part that is specific to this rock: the downstream fork of the Spark Operator, which
  # adds the Spark8tSubmitter. Upstream builds with `make build-operator`, which also stamps the
  # version reported by `spark-operator version`.
  #
  # For local development, copy the working tree of the fork next to this file first, since
  # rockcraft only sees the project directory:
  #   rsync -a --delete --exclude .git ../spark-operator/ ./spark-operator-src/
  # To build a release, replace `source` by the git URL of the fork, and add a `source-tag`.
  spark-operator:
    plugin: nil
    source: spark-operator-src
    source-type: local
    build-snaps:
      - go/1.25/stable
    build-packages:
      - make
      - git
    override-build: |
      # craft-parts exports C linker flags, which the Makefile would append to the Go ones.
      unset LDFLAGS CFLAGS CPPFLAGS
      mkdir -p ${CRAFT_PART_INSTALL}/usr/bin
      make build-operator \
        SPARK_OPERATOR=${CRAFT_PART_INSTALL}/usr/bin/spark-operator \
        GIT_VERSION=v2.6.0-canonical-spark8t
    stage:
      - usr/bin/spark-operator

  user-setup:
    plugin: nil
    after: [spark, spark8t, spark-operator]
    overlay-packages:
      - libc6
      - libpam-modules
      - krb5-user
      - libnss3
      - procps
      - openjdk-17-jre-headless

    override-prime: |
      # Shared user identity with the other Charmed Apache Spark rocks, see
      # https://discourse.ubuntu.com/t/unifying-user-identity-across-snaps-and-rocks/36469
      SPARK_GID=584792
      SPARK_UID=584792

      craftctl default

      chown -R ${SPARK_GID}:${SPARK_UID} etc/spark
      chmod -R 750 etc/spark

      # Needed to link py4j for PySpark, and to give the user RW access on the Spark folder
      (
        cd opt/spark/python/lib
        ln -sf py4j-*-src.zip py4j.zip
      )
      chown -R ${SPARK_GID}:${SPARK_UID} opt/spark
      chmod -R 750 opt/spark

      mkdir -p var/lib/spark
      chown -R ${SPARK_GID}:${SPARK_UID} var/lib/spark
      chmod -R 770 var/lib/spark

      chmod 755 usr/bin/spark-operator
